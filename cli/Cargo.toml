[package]
name = "captainstat-cli"
version = "0.1.0"
authors = ["Sanpi <sanpi@homecomputing.fr>"]
edition.workspace = true
rust-version.workspace = true

[dependencies]
envir.workspace = true
jiff = "0.2"
log.workspace = true
